name: Scheduled Tag Pruning

'on':
  schedule:
    - cron: '0 7 * * 0' # Weekly on Sunday at 2:00 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: 'Run in dry-run mode (no actual deletions)'

permissions:
  contents: write
  id-token: write
  actions: read
  statuses: write
  security-events: write

jobs:
  call-pruning-workflow:
    uses: converge-cloud/morpho-pipeline-templates/.github/workflows/prune-superseded-tags.yml@v0.4.14
    with:
      dry_run: ${{ inputs.dry_run }}
      keep_last_n: 5
      prune_gar_images: false
    secrets: inherit

  ci-telemetry:
    name: Emit CI Telemetry
    runs-on: ubuntu-latest
    needs: [call-pruning-workflow]
    if: always()

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Emit telemetry
      uses: converge-cloud/morpho-pipeline-templates/.github/actions/ci-telemetry@v0.4.14
      with:
        job_status: >-
          ${{
            contains(needs.*.result, 'failure') && 'failure' ||
            contains(needs.*.result, 'cancelled') && 'cancelled' ||
            'success'
          }}
        workflow_name: ${{ github.workflow }}
        service_name: ${{ github.event.repository.name }}
        grafana_otlp_endpoint: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
        grafana_otlp_auth: ${{ secrets.GRAFANA_OTLP_AUTH }}
        grafana_loki_url: ${{ secrets.GRAFANA_LOKI_URL }}
        grafana_loki_auth: ${{ secrets.GRAFANA_LOKI_AUTH }}
        pr_number: ${{ github.event.pull_request.number }}
        failed_job: ""


